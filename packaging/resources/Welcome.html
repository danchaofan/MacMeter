<title>安装 MacMeter</title><style>body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;padding:12px}h1{font-size:24px}li{margin:12px 0}</style></head>
<body><h1>MacMeter · 资源看板</h1><p>在 macOS 菜单栏查看 CPU、内存、网速和电池状态。</p>
<ul><li>支持 macOS 13 或更新版本，兼容 Intel 和 Apple 芯片。</li>
<li>应用将安装到“应用程序”文件夹。</li>
<li>升级前，请先从菜单栏退出正在运行的“资源看板”。原有偏好设置会保留。</li></ul>
<p>安装程序不会自动开启登录启动或通知，也不会自动打开应用。</p></body></html>
